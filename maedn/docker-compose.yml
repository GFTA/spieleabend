services:
  maedn:
    build:
      context: ..
      dockerfile: maedn/Dockerfile
      args:
        GAME: maedn
    image: maedn:latest
    container_name: maedn
    restart: unless-stopped
    ports:
      - "${MAEDN_PORT:-8084}:8080"
    volumes:
      - maedn-data:/data

volumes:
  maedn-data:
