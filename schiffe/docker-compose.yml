services:
  schiffe:
    build:
      context: ..
      dockerfile: schiffe/Dockerfile
      args:
        GAME: schiffe
    image: schiffe:latest
    container_name: schiffe
    restart: unless-stopped
    environment:
      PARTY_SECRET: ${PARTY_SECRET:-}
    ports:
      - "${SCHIFFE_PORT:-8081}:8080"
    volumes:
      - schiffe-data:/data

volumes:
  schiffe-data:
