services:
  wuerfelpoker:
    build:
      context: ..
      dockerfile: wuerfelpoker/Dockerfile
      args:
        GAME: wuerfelpoker
    image: wuerfelpoker:latest
    container_name: wuerfelpoker
    restart: unless-stopped
    ports:
      - "${WUERFEL_PORT:-8083}:8080"
    volumes:
      - wuerfelpoker-data:/data

volumes:
  wuerfelpoker-data:
