<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1426">
<title>Spieleabend</title>
<!--embed-->
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#1a1426; --bg2:#231a33; --surface:#2b2140; --line:#3d3057;
  --text:#f4effb; --muted:#a99cc2;
  --red:#e0393e; --yellow:#f2c230; --green:#2fa35b; --blue:#2d6fd6;
  --sea:#1f2350; --hull:#d9d2e6;
  --accent:#f2c230;
  --display:"Bowlby One", "Arial Black", Impact, system-ui, sans-serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* the same four table designs as in the games */
:root[data-table="felt"]{--bg:#0f2a1f;--bg2:#15372a;--surface:#1c4636;--line:#2b5c48;--text:#eef7f1;--muted:#9cc3b1;--sea:#10363a}
:root[data-table="ocean"]{--bg:#0e1a2b;--bg2:#15243a;--surface:#1c3050;--line:#2b4468;--text:#eef3fb;--muted:#9fb4d3;--sea:#123057}
:root[data-table="light"]{color-scheme:light;--bg:#eceff5;--bg2:#ffffff;--surface:#e2e7f0;--line:#cbd3e1;--text:#1b2030;--muted:#5b6479;--sea:#cfe0f3;--hull:#4a5570}
:root[data-table="blossom"]{color-scheme:light;--bg:#fbe3ec;--bg2:#fff6f9;--surface:#f7d4e1;--line:#eebfd0;--text:#3a1a2b;--muted:#8b5a70;--sea:#e6d9f4;--hull:#6b4a63}
:root[data-table="vulkan"]{--bg:#241512;--bg2:#301c17;--surface:#3d241d;--line:#583229;--text:#fbeee8;--muted:#cfa89a;--sea:#3a1c1a}
:root[data-table="mint"]{color-scheme:light;--bg:#dff3ea;--bg2:#f4fcf8;--surface:#c9e9db;--line:#b0d8c6;--text:#12352a;--muted:#4d7a68;--sea:#cfe9e0;--hull:#3f6656}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(90% 420px at 50% -80px,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%) no-repeat,var(--bg);color:var(--text);font:15px/1.45 var(--ui);-webkit-tap-highlight-color:transparent;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,56px);line-height:1;margin:0;letter-spacing:.01em}
h1 span{color:var(--accent)}
.hero h1{position:relative;font-size:clamp(32px,9vw,56px)}
.hero h1::before{content:"";position:absolute;right:100%;top:50%;width:1.15em;height:1.1em;margin:-.55em .1em 0 0;transform:rotate(-14deg);background:url(logo-mark.svg) center/contain no-repeat;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.tagline{margin:0;color:var(--muted);max-width:44ch;text-wrap:balance}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px}
.gamescol{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;flex-direction:column;gap:2px;margin:6px 2px 0}
.section-head .hint{margin:0;font-size:13px;color:var(--muted)}
.game{--tint:var(--accent);position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"art title play" "desc desc desc" "pb pb pb";align-items:center;gap:10px 14px;padding:14px;border-radius:22px;background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s}
.game .top{display:contents}
.game .art{grid-area:art;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--tint) 24%,var(--surface));overflow:hidden}
.game .art img{width:100%;height:100%;display:block}
.game .top>div:last-child{grid-area:title;min-width:0}
.game h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(15px,4.2vw,21px);line-height:1.1;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
.game .meta{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.game p{grid-area:desc;margin:0;color:var(--muted);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on::before{background:var(--green);box-shadow:0 0 0 3px rgba(47,163,91,.25)}
.pill.off::before{background:var(--red)}
.actions{grid-area:play;display:flex}
.actions .btn-primary{width:44px;height:44px;padding:0;font-size:0;border-radius:50%;box-shadow:0 3px 0 #b78d12}
.actions .btn-primary::before{content:"";width:0;height:0;margin-left:4px;border-left:13px solid #231a05;border-top:8px solid transparent;border-bottom:8px solid transparent;border-radius:2px}
.actions .btn-primary::after{content:"";position:absolute;inset:0;border-radius:22px}
.actions .btn-primary:active{box-shadow:0 1px 0 #b78d12;transform:translateY(2px)}
.partybox{grid-area:pb;display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-primary{background:var(--accent);color:#231a05;box-shadow:0 4px 0 #b78d12}
.btn-primary:active{box-shadow:0 2px 0 #b78d12;transform:translateY(2px)}
.join{flex:1 1 230px;display:flex;gap:8px;min-width:0}
.join input{flex:1;width:0;min-width:0;border:0;border-radius:14px;padding:10px;font-family:var(--display);font-size:20px;letter-spacing:.18em;text-transform:uppercase;text-align:center;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.join input::placeholder{color:var(--muted);letter-spacing:.1em}
.join .btn{padding:10px 14px;font-size:14px}
.layout,.side{display:contents}
footer{order:2}
@media (min-width:1000px){
  body{padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
  main{max-width:1400px;gap:22px}
  .game{grid-template-columns:72px minmax(0,1fr) auto;padding:16px}
  .game .art{width:72px;height:72px;border-radius:20px}
  .game h2{font-size:22px;overflow-wrap:normal;hyphens:auto}
  .game p{-webkit-line-clamp:3}
  .join{flex:1 1 180px}
  .hero{gap:6px}
  .hero h1{font-size:72px}
  .hero h1::before{width:1.75em;height:1.6em;margin-top:-.8em}
  .tagline{max-width:none}
  .layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px}
  .side>.me,.side>.party{width:100%;align-self:stretch}
  .games{grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px;align-content:start}
  .hero{padding-bottom:8px}
}
@media (hover:hover){ .btn:hover{filter:brightness(1.08)} .game:hover{box-shadow:inset 0 0 0 1.5px var(--tint)} }


.topbar{display:flex;justify-content:flex-end}
.seg{display:inline-flex;gap:6px;background:var(--bg2);padding:5px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;border-radius:50%;width:32px;height:32px;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.swatch{display:block;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.5)}
footer{text-align:center;color:var(--muted);font-size:12px}

/* who you are: name and avatar go with you into every game opened from here */
.me{align-self:center;width:min(100%,560px);display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:20px;background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--line)}
.merow{display:flex;gap:10px;align-items:center}
.avbtn{flex:none;width:50px;height:50px;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:28px;line-height:1;cursor:pointer}
.field{flex:1;width:0;min-width:0;border:0;border-radius:14px;padding:13px 14px;font-size:16px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.field::placeholder{color:var(--muted)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;padding:8px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.avgrid button{border:0;background:transparent;font-size:26px;aspect-ratio:1;border-radius:10px;padding:0;min-width:0;cursor:pointer}
/* avatar with colour; the host wears a crown */
.avc{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--avc,transparent);line-height:1;flex:none}
.avc.crown::after{content:"👑";position:absolute;top:-10px;left:50%;font-size:15px;line-height:1;transform:translateX(-50%) rotate(-10deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));pointer-events:none}
.avgrid{max-height:min(300px,48vh);overflow-y:auto;overscroll-behavior:contain}
.avgrid .avcols{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 8px}
.avgrid .avcols button{width:28px;height:28px;aspect-ratio:auto;border-radius:50%;padding:0;font-size:15px;color:var(--muted);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.avgrid .avcols button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.me .hint{margin:0;color:var(--muted);font-size:13px}

.merow2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.profilelink{font-size:14px;font-weight:800;color:var(--muted);text-decoration:none;padding:8px 4px}
.profilelink:hover{color:var(--text)}
/* party: play together, the host picks the game */
.party{align-self:center;width:min(100%,560px);display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:20px;background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--line)}
.party h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.party p{margin:0;color:var(--muted);font-size:13px}
.party .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.party .row>.btn{flex:1 1 140px;padding:12px 16px;font-size:15px}
.party .join{flex:1 1 200px}
.pinvite{display:flex;align-items:center;gap:8px}
.pinvite .btn{padding:10px 12px;font-size:14px;flex:none}
.pcode{flex:1;min-width:0;font-family:var(--display);font-size:28px;letter-spacing:.1em;line-height:1}
.plink{display:flex;gap:8px;align-items:center}
.plink code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px;box-shadow:inset 0 0 0 1.5px var(--line)}
.plink .btn{padding:10px 14px;font-size:14px}
.pshare{display:flex;align-items:center;justify-content:center;gap:6px}
.shareback{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);background:rgba(10,7,18,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sharesheet{width:100%;max-width:400px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;gap:14px;text-align:center;padding:22px 18px;border-radius:24px;background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--line),0 20px 60px rgba(0,0,0,.5)}
.sharesheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.sharesheet p{margin:0;color:var(--muted);font-size:13px}
.sharesheet .qr{align-self:center;width:min(240px,62vw);height:min(240px,62vw);padding:12px;border-radius:18px;background:#fff;display:grid;place-items:center}
.sharesheet .qr svg{width:100%;height:100%;display:block}
.sharecode{font-family:var(--display);font-size:40px;letter-spacing:.12em;line-height:1;color:var(--accent);margin-right:-.12em}
.sharesheet .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.pmembers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pmembers li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--surface)}
.pmembers .av{font-size:21px;line-height:1}
.pmembers .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.pmembers .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--green)}
.pmembers .dot.off{background:var(--muted);opacity:.6}
.tag{flex:none;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--green);color:#fff}
.pmembers .rm{flex:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.pgame{padding:12px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.pgame b{font-size:15px}
.pnote{color:var(--muted);font-size:13px;padding:8px 10px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.perr{color:#ff8a8f;font-size:13px;min-height:0}
.partybox{display:flex;flex-direction:column;gap:8px}
/* in a party the host picks the game: no own start button on the cards */
.inparty .game .actions{display:none}
.partybox:empty{display:none}
.partybox:not(:empty){margin-top:auto}
.partybox:not(:empty)+.actions{margin-top:0}
.partybox .btn{width:100%}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="label">cool-kidz.net</div>
    <h1>Spiele<span>abend</span></h1>
  </header>

  <div class="layout">
  <aside class="side">
  <section class="me" aria-label="Du">
    <div class="label">Du · gilt in allen Spielen</div>
    <div class="merow">
      <button class="avbtn" id="myAvatar" type="button" aria-label="Avatar wählen" aria-expanded="false"></button>
      <input class="field" id="myName" maxlength="18" autocomplete="nickname" enterkeyhint="done" placeholder="Dein Name" aria-label="Dein Name">
    </div>
    <div class="avgrid" id="avatarGrid" hidden></div>
    <div class="merow2"><div class="seg" id="tables" role="group" aria-label="Design wählen"></div><a class="profilelink" href="profile.html">Profil &amp; Statistik ›</a></div>
  </section>

  <section class="party" id="party" aria-label="Party"></section>

  <div class="shareback" id="shareSheet" hidden><div class="sharesheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <h2 id="shareTitle">Zur Party einladen</h2>
    <div class="qr" id="shareQr" hidden></div>
    <div class="sharecode" id="shareCode" aria-label="Party-Code"></div>
    <p>Scannt den QR-Code oder öffnet den Link.</p>
    <button class="btn btn-primary" id="shareGo" type="button"></button>
    <button class="btn" id="shareClose" type="button">Schließen</button>
  </div></div>

  </aside>

  <div class="gamescol">
  <div class="section-head"><div class="label">Spiele</div><p class="hint">Ohne Party startet ein Spiel allein gegen den Computer.</p></div>
  <section class="games" id="games" aria-label="Spiele"></section>
  </div>
  </div>


</main>

<script src="avatars.js"></script>
<script src="profile.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

  // table design, same choices as in the games - picked here top-right, carried over to
  // whichever game gets opened via a ?table= param on its link (see render() below)
  const TABLES = [["night", "Nacht", "#1a1426"], ["felt", "Filz", "#15372a"], ["ocean", "Ozean", "#15243a"], ["light", "Hell", "#eceff5"], ["blossom", "Blüte", "#f7c6d9"], ["vulkan", "Vulkan", "#301c17"], ["mint", "Minze", "#dff3ea"]];
  let table = "night";
  try { table = JSON.parse(localStorage.getItem("spieleabend.table")) || "night"; } catch (e) {}
  function applyTable() {
    const root = document.documentElement;
    if (table === "night") delete root.dataset.table; else root.dataset.table = table;
    const t = TABLES.find((x) => x[0] === table) || TABLES[0];
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t[2]);
    $("#tables").innerHTML = TABLES.map(([k, n, c]) => `<button type="button" data-t="${k}" aria-pressed="${k === table}" aria-label="${n}" title="${n}"><span class="swatch" style="background:${c}"></span></button>`).join("");
  }
  $("#tables").addEventListener("click", (e) => {
    const b = e.target.closest("[data-t]"); if (!b) return;
    table = b.dataset.t;
    try { localStorage.setItem("spieleabend.table", JSON.stringify(table)); } catch (err) {}
    applyTable();
    updateLinks();
  });
  applyTable();

  // name, avatar and colour: the profile (profile.js, one cookie for every game), handed to the games as ?name=…&av=…
  const { AVATARS, COLORS } = window.SAAvatars, P = window.SAProfile;
  let me = { name: "", avatar: "", color: "" };
  function loadMe() { const p = P.get(); me = { name: p.name, avatar: p.av, color: p.col }; }
  loadMe();
  if (!me.avatar) { me.avatar = AVATARS[Math.floor(Math.random() * AVATARS.length)]; P.set({ av: me.avatar }); }
  function renderMe() {
    const b = $("#myAvatar");
    b.textContent = me.avatar; b.style.background = me.color || "";
    if (!$("#avatarGrid").hidden) $("#avatarGrid").innerHTML = pickerHTML();
  }
  function pickerHTML() {
    return `<div class="avcols" role="group" aria-label="Farbe"><button type="button" data-col="" aria-pressed="${!me.color}" aria-label="Keine Farbe">∅</button>` +
      COLORS.map((c) => `<button type="button" data-col="${c}" aria-pressed="${c === me.color}" style="background:${c}" aria-label="Farbe ${c}"></button>`).join("") + `</div>` +
      AVATARS.map((a) => `<button type="button" data-pick="${a}" aria-pressed="${a === me.avatar}" aria-label="Avatar ${a}">${a}</button>`).join("");
  }
  const tellParty = () => { if (party && saved) act({ t: "avatar", avatar: me.avatar, color: me.color }).catch(() => {}); };
  $("#myName").value = me.name;
  $("#myName").addEventListener("input", (e) => { me.name = e.target.value; P.set({ name: me.name.trim() }); updateLinks(); });
  $("#myAvatar").addEventListener("click", () => {
    const g = $("#avatarGrid");
    g.hidden = !g.hidden;
    if (!g.hidden) g.innerHTML = pickerHTML();
    $("#myAvatar").setAttribute("aria-expanded", String(!g.hidden));
  });
  $("#avatarGrid").addEventListener("click", (e) => {
    const c = e.target.closest("[data-col]"), b = e.target.closest("[data-pick]");
    if (c) { me.color = c.dataset.col; P.set({ col: me.color }); }
    else if (b) { me.avatar = b.dataset.pick; P.set({ av: me.avatar }); $("#avatarGrid").hidden = true; $("#myAvatar").setAttribute("aria-expanded", "false"); }
    else return;
    renderMe(); updateLinks(); tellParty();
  });
  renderMe();

  // without a party "Spielen" opens the game in its single-player tab (?sp=1)
  function gameUrl(base, extra) {
    const u = new URL(base);
    for (const [k, v] of Object.entries(extra || {})) u.searchParams.set(k, v);
    if (table !== "night") u.searchParams.set("table", table);
    if (!party) u.searchParams.set("sp", "1");
    if (me.name.trim()) u.searchParams.set("name", me.name.trim());
    u.searchParams.set("av", me.avatar);
    return u.toString();
  }
  // only touch the hrefs, so a room code someone is typing stays put
  function updateLinks() {
    for (const a of document.querySelectorAll(".game a[data-url]")) a.href = gameUrl(a.dataset.url);
  }

  const TINT = { uno: "#e0393e", schiffe: "#2d6fd6", viergewinnt: "#f2c230", wuerfelpoker: "#f28a1f", kniffel: "#2fa35b", poker: "#8a4fd0", maedn: "#1fb5c9", hangman: "#b98a5a", phase10: "#ec6fb2" };
  let games = [];
  function render(status) {
    const st = Object.fromEntries((status || []).map((s) => [s.id, s]));
    $("#games").innerHTML = games.map((g) => {
      const s = st[g.id];
      const pill = !s ? `<span class="pill">Prüfe …</span>`
        : s.online ? `<span class="pill on">Online${s.rooms ? ` · ${s.rooms} ${s.rooms === 1 ? "Raum" : "Räume"} offen` : ""}</span>`
        : `<span class="pill off">Gerade nicht erreichbar</span>`;
      return `<article class="game" data-id="${esc(g.id)}" style="--tint:${TINT[g.id] || "var(--accent)"}">
        <div class="top">
          <div class="art"><img src="${esc(g.id)}.svg" alt="" width="88" height="88"></div>
          <div><h2>${esc(g.name)}</h2><div class="meta"><span>${esc(g.players)}</span>${pill}</div></div>
        </div>
        <p>${esc(g.desc)}</p>
        <div class="partybox" data-for="${esc(g.id)}"></div>
        <div class="actions">
          <a class="btn btn-primary" href="${esc(gameUrl(g.url))}" data-url="${esc(g.url)}" aria-label="${esc(g.name)} spielen">Spielen</a>
        </div>
      </article>`;
    }).join("");
    renderPartyBoxes();
  }

  let lastStatus = null;
  async function refresh() {
    try { lastStatus = await (await fetch("status.json", { cache: "no-store" })).json(); } catch (e) {}
    // keep what people are typing: only update the status pills
    for (const s of lastStatus || []) {
      const card = document.querySelector(`.game[data-id="${s.id}"] .pill`);
      if (!card) continue;
      card.className = `pill ${s.online ? "on" : "off"}`;
      card.textContent = s.online ? `Online${s.rooms ? ` · ${s.rooms} ${s.rooms === 1 ? "Raum" : "Räume"} offen` : ""}` : "Gerade nicht erreichbar";
    }
  }
  // ---------- party ----------
  const PK = "spieleabend.party", WK = "spieleabend.went"; // stored membership, last game room we were sent into
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const write = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const SHARE_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/></svg>';
  let unloading = false;
  addEventListener("pagehide", () => { unloading = true; });
  let party = null, saved = read(PK), es = null, msg = "", busy = false, prefill = "";

  async function api(path, body) {
    let r;
    try { r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); }
    catch (e) { throw new Error("Keine Verbindung zum Server."); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "Das hat nicht geklappt."), { status: r.status });
    return j;
  }
  const act = (body) => api("party/act", Object.assign({ code: saved.code, secret: saved.secret }, body));
  function say(text) { msg = text || ""; const e = $("#partyErr"); if (e) e.textContent = msg; }

  function leaveLocal(text) {
    if (es) { es.close(); es = null; }
    party = null; saved = null; write(PK, null); busy = false;
    renderParty(); renderPartyBoxes(); say(text);
  }
  function connectParty() {
    if (es) es.close();
    if (!saved) return;
    const src = new EventSource(`party/events?code=${encodeURIComponent(saved.code)}&secret=${encodeURIComponent(saved.secret)}`);
    es = src;
    src.onmessage = (e) => { if (es !== src) return; party = JSON.parse(e.data); busy = false; renderParty(); renderPartyBoxes(); maybeGo(); };
    src.addEventListener("kicked", () => { if (es === src) leaveLocal("Du wurdest aus der Party entfernt."); });
    // a closed stream (a dropped one reconnects on its own) may mean the party is gone: ask before forgetting it
    src.onerror = async () => {
      if (es !== src || unloading || src.readyState !== 2) return;
      try { await act({ t: "ping" }); } catch (e) { if (e.status === 404) return void leaveLocal("Diese Party gibt es nicht mehr."); }
      setTimeout(() => { if (es === src && saved) connectParty(); }, 3000);
    };
  }
  // back from standby or a network change: the event stream may be dead without saying so, so open a fresh one
  let hiddenAt = 0;
  async function wake() {
    if (!saved) return;
    try { await act({ t: "ping" }); } catch (e) { if (e.status === 404) return void leaveLocal("Diese Party gibt es nicht mehr."); }
    if (saved) connectParty();
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") hiddenAt = Date.now();
    else if (saved && (Date.now() - hiddenAt > 8000 || !es || es.readyState !== 1)) wake();
  });
  addEventListener("online", wake);
  addEventListener("pageshow", (e) => { if (e.persisted) { unloading = false; wake(); } });
  // the host started a game: everybody follows into it, once per room
  function maybeGo() {
    const g = party && party.game;
    if (!g || !g.params || read(WK) === g.room) return;
    const def = games.find((x) => x.id === g.id);
    if (!def) return;
    write(WK, g.room);
    location.href = gameUrl(def.url, g.params);
  }
  const overHint = (g) => {
    const n = party ? party.members.length : 0;
    if (!g.max || n <= g.max || g.hint === false) return "";
    return `Die Party hat ${n} Leute, ${g.name} hat ${g.max} Plätze. Es spielen der Host und alle, die „Bereit“ gedrückt haben, die anderen schauen zu.`;
  };
  function renderPartyBoxes() {
    document.body.classList.toggle("inparty", !!party);
    updateLinks();
    for (const box of document.querySelectorAll(".partybox")) {
      const g = games.find((x) => x.id === box.dataset.for);
      if (!g) { box.innerHTML = ""; continue; }
      if (!party) { box.innerHTML = ""; continue; }
      const host = party.you === party.host, hint = overHint(g);
      box.innerHTML = (hint ? `<div class="pnote">${esc(hint)}</div>` : "") +
        (host ? `<button class="btn btn-primary" type="button" data-launch="${esc(g.id)}"${busy ? " disabled" : ""}>${busy ? "Starte …" : "Spielen"}</button>` : "");
    }
  }
  function renderParty() {
    const box = $("#party");
    if (!party) {
      box.innerHTML = `<h3>Party</h3>
        <p>Zusammen spielen: Der Host wählt das Spiel, alle landen automatisch im selben Raum.</p>
        <div class="row"><button class="btn btn-primary" type="button" data-p="create">Party erstellen</button>
        <form class="join" data-p="join"><input id="partyCode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="CODE" aria-label="Party-Code" value="${esc(prefill)}"><button class="btn" type="submit">Beitreten</button></form></div>
        <div class="perr" id="partyErr" role="alert">${esc(msg)}</div>`;
      return;
    }
    const host = party.you === party.host, mine = party.members[party.you], g = party.game && games.find((x) => x.id === party.game.id);
    let game = "";
    if (g) {
      const r = party.game;
      game = `<div class="pgame"><b>Läuft gerade: ${esc(g.name)}</b>` +
        (r.params ? `<a class="btn btn-primary" href="${esc(gameUrl(g.url, r.params))}">${r.role === "watch" ? "Zuschauen" : "Zurück ins Spiel"}</a>`
          : r.role === "out" ? `<span class="pnote">Für dich war kein Platz frei, und ${esc(g.name)} hat keine Zuschauer.</span>`
          : `<span class="pnote">Du bist erst nach dem Start dazugekommen.</span>`) +
        (r.watching || r.out ? `<span class="pnote">${r.playing} spielen${r.watching ? `, ${r.watching} schauen zu` : ""}${r.out ? `, ${r.out} ohne Platz` : ""}.</span>` : "") + `</div>`;
    }
    box.innerHTML = `<h3>Deine Party</h3>
      <div class="pinvite"><div class="pcode" aria-label="Party-Code">${esc(party.code)}</div>
      <button class="btn pshare" type="button" data-p="share">${SHARE_ICON}<span>Teilen</span></button></div>
      <ul class="pmembers">${party.members.map((m, i) => `<li><span class="dot${m.online ? "" : " off"}" title="${m.online ? "hier" : "gerade im Spiel oder weg"}"></span><span class="av avc${i === party.host ? " crown" : ""}" style="--avc:${esc(/^#[0-9a-f]{6}$/.test(m.color) ? m.color : "transparent")}">${esc(m.avatar)}</span><span class="nm">${esc(m.name)}</span>${m.ready ? '<span class="tag ok">Bereit</span>' : ""}${i === party.host ? '<span class="tag">Host</span>' : ""}${i === party.you ? '<span class="tag">du</span>' : ""}${host && i !== party.you ? `<button class="rm" type="button" data-kick="${i}" aria-label="${esc(m.name)} entfernen">×</button>` : ""}</li>`).join("")}</ul>
      ${game}
      <p>${host ? "Du bist der Host: Wähl unten ein Spiel." : "Der Host wählt das Spiel, dann geht es für alle automatisch los."} „Bereit“ zeigt, wer mitspielen will, falls das Spiel zu wenige Plätze hat.</p>
      <div class="row"><button class="btn${mine.ready ? "" : " btn-primary"}" type="button" data-p="ready">${mine.ready ? "Nicht bereit" : "Bereit"}</button><button class="btn" type="button" data-p="leave">Party verlassen</button></div>
      <div class="perr" id="partyErr" role="alert">${esc(msg)}</div>`;
  }
  function needName() { if (me.name.trim()) return false; say("Trag oben deinen Namen ein."); $("#myName").focus(); return true; }
  async function enter(path, body) {
    try {
      const r = await api(path, body);
      saved = { code: r.view.code, secret: r.secret }; write(PK, saved); party = r.view; prefill = ""; say("");
      renderParty(); renderPartyBoxes(); connectParty();
    } catch (e) { say(e.message); }
  }
  $("#party").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-p],[data-kick]"); if (!b) return;
    try {
      if (b.dataset.kick) return void await act({ t: "kick", index: +b.dataset.kick });
      switch (b.dataset.p) {
        case "create": if (needName()) return; await enter("party/create", { name: me.name.trim(), avatar: me.avatar, color: me.color }); break;
        case "ready": await act({ t: "ready", on: !party.members[party.you].ready }); break;
        case "leave": await act({ t: "leave" }); leaveLocal(""); break;
        case "share": openShare(); break;
      }
    } catch (err) { say(err.message); }
  });
  // invite sheet: QR code of the party link, below it the button for the system share menu
  let qrLoad = null;
  function loadQr() {
    if (window.qrcode) return Promise.resolve();
    return qrLoad || (qrLoad = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "vendor/qrcode.js"; s.onload = res; s.onerror = () => { qrLoad = null; rej(); }; document.head.appendChild(s); }));
  }
  function openShare() {
    if (!party) return;
    const url = `${location.origin}/?party=${party.code}`, box = $("#shareQr");
    $("#shareCode").textContent = party.code;
    $("#shareGo").innerHTML = navigator.share ? `${SHARE_ICON}<span>Teilen</span>` : "<span>Link kopieren</span>";
    box.hidden = true;
    loadQr().then(() => { const q = window.qrcode(0, "M"); q.addData(url); q.make(); box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); box.hidden = false; }).catch(() => {});
    $("#shareSheet").hidden = false;
    $("#shareGo").focus();
  }
  const closeShare = () => { $("#shareSheet").hidden = true; };
  $("#shareClose").addEventListener("click", closeShare);
  $("#shareSheet").addEventListener("click", (e) => { if (e.target.id === "shareSheet") closeShare(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#shareSheet").hidden) closeShare(); });
  $("#shareGo").addEventListener("click", async () => {
    if (!party) return;
    const url = `${location.origin}/?party=${party.code}`, text = `Komm in meine Spieleabend-Party! Code: ${party.code}`, b = $("#shareGo");
    if (navigator.share) { try { await navigator.share({ title: "Spieleabend", text, url }); } catch (err) { if (err.name !== "AbortError") say("Teilen hat nicht geklappt."); } return; }
    try { await navigator.clipboard.writeText(url); b.lastChild.textContent = "Kopiert"; setTimeout(() => { b.lastChild.textContent = "Link kopieren"; }, 2000); }
    catch (err) { b.lastChild.textContent = "Kopieren geht hier nicht"; setTimeout(() => { b.lastChild.textContent = "Link kopieren"; }, 2000); }
  });
  $("#party").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("#partyCode"), code = input.value.toUpperCase().replace(/[^A-Z]/g, "");
    if (code.length !== 4) { input.focus(); input.select(); return; }
    if (needName()) { prefill = code; return; }
    enter("party/join", { code, name: me.name.trim(), avatar: me.avatar, color: me.color });
  });
  $("#party").addEventListener("input", (e) => { if (e.target.id === "partyCode") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ""); });
  $("#games").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-launch]"); if (!b || busy) return;
    busy = true; say(""); renderPartyBoxes();
    try { await act({ t: "launch", game: b.dataset.launch }); }
    catch (err) { busy = false; renderPartyBoxes(); say(err.message); const p = $("#party"); p.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  });

  // a ?party=CODE link (a friend's invitation, or "back to the party" from a game)
  const qParty = new URLSearchParams(location.search).get("party");
  if (qParty) {
    const code = qParty.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
    if (saved && saved.code !== code) prefill = code; // already in another party: show the join form with this code
    else if (!saved) prefill = code;
    history.replaceState(null, "", location.pathname);
  }
  renderParty();
  connectParty();

  fetch("games.json", { cache: "no-store" }).then((r) => r.json()).then((g) => { games = g; render(null); renderParty(); maybeGo(); refresh(); setInterval(refresh, 15000); })
})();
</script>
</body>
</html>
