services:
  spiele-start:
    build: .
    image: spiele-start:latest
    container_name: spiele-start
    restart: unless-stopped
    ports:
      - "${START_PORT:-8090}:8080"
    # read live from the repo: after `git pull` a new game shows up without a rebuild
    volumes:
      - ./games.json:/app/games.json:ro
      - ./public:/app/public:ro
