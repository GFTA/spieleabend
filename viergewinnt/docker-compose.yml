services:
  viergewinnt:
    build:
      context: ..
      dockerfile: viergewinnt/Dockerfile
      args:
        GAME: viergewinnt
    image: viergewinnt:latest
    container_name: viergewinnt
    restart: unless-stopped
    ports:
      - "${VIER_PORT:-8082}:8080"
    volumes:
      - viergewinnt-data:/data

volumes:
  viergewinnt-data:
