services:
  pass-uno:
    build:
      context: ..
      dockerfile: uno/Dockerfile
      args:
        GAME: uno
    image: pass-uno:latest
    container_name: pass-uno
    restart: unless-stopped
    ports:
      - "${UNO_PORT:-8080}:8080"
    volumes:
      - pass-uno-data:/data

volumes:
  pass-uno-data:
